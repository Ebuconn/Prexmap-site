<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Prex Map">
<meta property="og:description" content="See the trail before you go. Real on-the-ground footage synced to route maps.">
<title>Prex Map</title>
<meta name="description" content="Prex Map pairs trail maps with on-the-ground footage so you can pre-explore a route before you go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,600..900&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: topo-map paper; hero scrubs a real route; catalog reads like trailhead signs; route page = video · profile · map. */
:root{
  --paper:#F2F5F1;--paper-2:#E6ECE6;--ink:#16241E;--ink-2:#4A5C53;--contour:#C3D0C6;
  --blaze:#D9501C;--water:#2C6A86;--line:#CBD6CE;--card:#FFFFFF;--fill:rgba(217,80,28,.14);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;--hdr:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1814;--paper-2:#17231D;--ink:#E4ECE6;--ink-2:#9DB0A5;--contour:#24362C;
  --blaze:#F06A32;--water:#6FB2D0;--line:#2A3B32;--card:#14201A;--fill:rgba(240,106,50,.18);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1814;--paper-2:#17231D;--ink:#E4ECE6;--ink-2:#9DB0A5;--contour:#24362C;
  --blaze:#F06A32;--water:#6FB2D0;--line:#2A3B32;--card:#14201A;--fill:rgba(240,106,50,.18);color-scheme:dark}

*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--blaze);outline-offset:3px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-stretch:118%;line-height:1.05;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:var(--hdr);position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:900;font-stretch:125%;font-size:20px}
.brand svg{flex:none}
.nav{margin-left:auto;display:flex;gap:4px}
.nav a{text-decoration:none;font-weight:600;font-size:15px;padding:8px 12px;border-radius:999px;color:var(--ink-2)}
.nav a:hover,.nav a[aria-current]{color:var(--ink);background:var(--paper-2)}
.menu-btn{display:none;margin-left:auto;background:none;border:0;padding:10px;color:var(--ink);cursor:pointer}
@media (max-width:720px){
  .nav{display:none}.menu-btn{display:block}
  .nav.open{display:flex;position:absolute;left:0;right:0;top:var(--hdr);flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
  .nav.open a{padding:14px 8px;font-size:18px;border-radius:var(--r)}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px/1 var(--f-body);text-decoration:none;border:0;cursor:pointer;padding:13px 18px;border-radius:999px;min-height:46px}
.btn-blaze{background:var(--blaze);color:#fff}.btn-blaze:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.btn-ghost:hover{background:var(--paper-2)}
.btn-sm{min-height:38px;padding:9px 14px;font-size:14px}

/* Hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center;padding-block:60px 68px}
.hero h1{font-size:clamp(40px,7vw,78px);font-weight:900;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--blaze)}
.lede{font-size:clamp(18px,2.2vw,21px);color:var(--ink-2);max-width:34ch;margin:20px 0 28px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.hero-meta{display:flex;flex-wrap:wrap;gap:28px;margin-top:32px}
.hero-meta div{display:flex;flex-direction:column}
.hero-meta b{font-family:var(--f-display);font-stretch:125%;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.hero-meta span{font-size:14px;color:var(--ink-2)}
@media (max-width:520px){.hero-meta{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:12px}.hero-meta b{font-size:24px}.hero-meta span{font-size:12.5px;line-height:1.25}}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr;gap:32px;padding-block:36px 44px}}

/* Shared viewer parts */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.panel-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px 0}
.readouts div{display:flex;flex-direction:column;min-width:0}
.readouts b{font-family:var(--f-mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.readouts span{font-size:12px;color:var(--ink-2)}
@media (max-width:420px){.readouts{grid-template-columns:repeat(2,1fr)}}
.profile{display:block;width:100%;height:120px;touch-action:none;cursor:ew-resize;padding:0}
.profile:focus-visible{outline-offset:-2px}
.scrub-row{display:flex;align-items:center;gap:10px;padding:0 14px 12px}
.scrub-hint{font-size:13px;color:var(--ink-2)}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--blaze);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.svgmap{display:block;width:100%;height:100%;background:var(--paper)}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#0b0f0d;overflow:hidden}
.frame iframe,.frame #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:16px;color:#fff;
  background:radial-gradient(120% 90% at 50% 110%,#2f4a36 0%,#16241e 60%,#0b0f0d 100%)}
.frame .ph p{margin:0;max-width:34ch;font-size:15px;opacity:.85}
.frame .hud{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:4px}

/* Sections */
section.block{padding-block:72px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.sec-head h2{font-size:clamp(30px,4.4vw,46px);font-weight:900;margin-top:8px}
.sec-head p{color:var(--ink-2);max-width:46ch;margin:8px 0 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:16px;min-width:0}
.steps li::before{content:"Step " counter(s);display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blaze);margin-bottom:8px}
.steps h3{font-size:22px;margin-bottom:8px}
.steps p{margin:0;color:var(--ink-2)}
@media (max-width:760px){.steps{grid-template-columns:1fr;gap:24px}}

/* Catalog */
.filters{display:grid;gap:12px;margin-bottom:24px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:48px;max-width:420px}
.search input{border:0;background:transparent;font:inherit;color:var(--ink);flex:1;min-width:0;outline:none;padding:10px 0}
.search:focus-within{border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 14px/1 var(--f-body);padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:40px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-weight:400;opacity:.65;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.route{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:transform .15s,border-color .15s;min-width:0}
.route:hover{transform:translateY(-2px);border-color:var(--ink-2)}
.thumb{aspect-ratio:16/9;max-width:100%;background:var(--paper-2);position:relative;overflow:hidden}
.thumb>svg{width:100%;height:100%;display:block}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .inset{position:absolute;right:8px;bottom:8px;width:34%;aspect-ratio:1;background:color-mix(in srgb,var(--paper) 88%,transparent);border-radius:6px;border:1px solid var(--line)}
.thumb .inset svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:10px;left:10px;font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.route .body{padding:14px 16px 16px;display:grid;gap:6px}
.route h3{font-size:19px;font-stretch:112%}
.route .where{font-size:14px;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats span{white-space:nowrap}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px}

/* Races band */
.band{background:var(--ink);color:var(--paper)}
.band .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:64px}
.band h2{font-size:clamp(30px,4.4vw,46px);font-weight:900;margin-top:8px}
.band p{color:color-mix(in srgb,var(--paper) 75%,transparent);max-width:44ch}
.band .eyebrow{color:color-mix(in srgb,var(--paper) 65%,transparent)}
.racelist{display:grid;gap:12px;min-width:0}
.race{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-decoration:none;border:1px solid color-mix(in srgb,var(--paper) 25%,transparent);border-radius:10px;padding:14px 16px}
.race:hover{border-color:var(--blaze)}
.race b{font-family:var(--f-display);font-stretch:112%;font-size:18px}
.race .mono{font-size:13px;color:color-mix(in srgb,var(--paper) 75%,transparent);grid-column:1/-1}
.race .arrow{color:var(--blaze);font-weight:700}
@media (max-width:820px){.band .wrap{grid-template-columns:1fr}}

/* Support */
.support{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:10px;align-content:start;min-width:0}
.box h3{font-size:22px}.box p{margin:0;color:var(--ink-2)}
.copyline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
.copyline code{font-family:var(--f-mono);font-size:15px;background:var(--paper-2);padding:8px 12px;border-radius:var(--r);user-select:all;word-break:break-all}
.copy{font:600 14px/1 var(--f-body);background:none;border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:999px;cursor:pointer;min-height:38px}
@media (max-width:720px){.support{grid-template-columns:1fr}}

/* Route page */
.crumbs{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;padding-top:20px}
.crumbs a{text-decoration:none;font-weight:600}.crumbs a:hover{text-decoration:underline}
.detail-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;padding-block:12px 20px}
.detail-head h1{font-size:clamp(30px,5.4vw,54px);font-weight:900}
.factrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fact{font:600 14px/1 var(--f-body);padding:8px 12px;border-radius:999px;background:var(--paper-2)}
.fact.mono{font-family:var(--f-mono);font-weight:500}
.viewer{display:grid;gap:16px;grid-template-columns:1fr}
.viewer .mapbox{position:relative;height:min(58vh,520px);min-height:300px}
#maphost{position:absolute;inset:0}#maphost>div,#maphost>svg{width:100%;height:100%}
.maptoggle[hidden]{display:none}
.maptoggle{position:absolute;top:10px;right:10px;z-index:500;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.maptoggle button{font:600 13px/1 var(--f-body);border:0;background:none;color:var(--ink);padding:8px 11px;border-radius:999px;cursor:pointer}
.maptoggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (min-width:980px){
  .viewer{grid-template-columns:1.15fr 1fr;align-items:start}
  .viewer .mapcol{position:sticky;top:calc(var(--hdr) + 16px + env(safe-area-inset-top,0px))}
  .viewer .mapbox{height:calc(100vh - var(--hdr) - 120px);max-height:720px}
}
.detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;padding-block:40px 24px}
.detail-grid h2{font-size:26px;margin-bottom:12px}
.detail-grid p{color:var(--ink-2);margin:0 0 12px;max-width:62ch}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.checklist svg{flex:none;margin-top:4px;color:var(--blaze)}
@media (max-width:820px){.detail-grid{grid-template-columns:1fr;gap:28px}}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:24px 72px}
.pager a{display:grid;gap:4px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card);min-width:0}
.pager a:hover{border-color:var(--ink-2)}
.pager a:last-child{text-align:right}
.pager b{font-family:var(--f-display);font-stretch:112%;font-size:17px;overflow-wrap:anywhere}

/* About */
.about{display:grid;grid-template-columns:1fr 1.3fr;gap:48px;padding-block:56px 72px;align-items:start}
.about h1{font-size:clamp(34px,5.6vw,58px);font-weight:900;margin-top:10px}
.prose p{color:var(--ink-2);margin:0 0 16px;max-width:62ch;font-size:18px}
.prose p:first-child{color:var(--ink);font-size:21px}
.timeline{list-style:none;margin:28px 0 0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 20px 20px}
.timeline li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--blaze)}
.timeline b{display:block;font-family:var(--f-display);font-stretch:112%}
.timeline span{color:var(--ink-2);font-size:15px}
@media (max-width:820px){.about{grid-template-columns:1fr;gap:24px;padding-block:36px 56px}}

footer{border-top:1px solid var(--line);padding-block:32px 40px;font-size:14px;color:var(--ink-2)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer a{text-decoration:none}footer a:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:70}
.leaflet-container{background:var(--paper-2);font-family:var(--f-body)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" data-link="home" aria-label="Prex Map home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="var(--ink)"/><path d="M7 23c3-1 4-6 8-6s4 3 6 2 3-7 4-10" fill="none" stroke="var(--blaze)" stroke-width="2.6" stroke-linecap="round"/><circle cx="25" cy="9" r="2.6" fill="var(--paper)"/></svg>
      Prex Map
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="nav" id="nav">
      <a href="#home" data-link="home">Home</a>
      <a href="#routes" data-link="routes">Routes</a>
      <a href="#races" data-link="races">Races</a>
      <a href="#about" data-link="about">About</a>
      <a href="#support" data-link="support">Contact</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div>© 2026 Prex Map · Founded by Elijah Bova</div>
    <nav><a href="#routes" data-link="routes">Routes</a><a href="#about" data-link="about">About</a><a href="#support" data-link="support">Contact</a></nav>
  </div>
</footer>

<script>

function prep(r){
  if(r._p)return r._p;
  const T=r.track,n=T.length;
  // cumulative climb, scaled to the stored total
  const cg=[0];let ref=T[0][2],g=0;
  for(let i=1;i<n;i++){const e=T[i][2];if(e>ref+1){g+=e-ref;ref=e}else if(e<ref)ref=e;cg.push(g)}
  const k=g>0?(r.gainFt/3.28084)/g:0;for(let i=0;i<n;i++)cg[i]*=k;
  return r._p={T,n,cg,tEnd:T[n-1][3],mEnd:T[n-1][4]};
}
function interp(P,i,f){const a=P.T[i],b=P.T[Math.min(P.n-1,i+1)];const L=(x,y)=>x+(y-x)*f;
  return{lat:L(a[0],b[0]),lon:L(a[1],b[1]),ele:L(a[2],b[2]),t:L(a[3],b[3]),mi:L(a[4],b[4]),climb:L(P.cg[i],P.cg[Math.min(P.n-1,i+1)])}}
function find(P,col,v){let lo=0,hi=P.n-1;if(v<=P.T[0][col])return interp(P,0,0);if(v>=P.T[hi][col])return interp(P,hi,0);
  while(hi-lo>1){const m=(lo+hi)>>1;if(P.T[m][col]<=v)lo=m;else hi=m}const span=P.T[hi][col]-P.T[lo][col];return interp(P,lo,span>0?(v-P.T[lo][col])/span:0)}
const atMile=(P,mi)=>find(P,4,mi), atTime=(P,t)=>find(P,3,t);

function projector(r,w,h,pad){
  const T=r.track;let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const p of T){a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1])}
  const kx=Math.cos((a+b)/2*Math.PI/180),sx=(d-c)*kx||1e-6,sy=(b-a)||1e-6;
  const s=Math.min((w-2*pad)/sx,(h-2*pad)/sy),ox=(w-sx*s)/2,oy=(h-sy*s)/2;
  return(lat,lon)=>[ox+(lon-c)*kx*s,oy+(b-lat)*s];

  const cx=w*(.25+.5*rnd()),cy=h*(.25+.5*rnd()),rot=(rnd()*40-20).toFixed(0);let s="";
  for(let k=1;k<=8;k++)s+=`<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" rx="${(k*w*.085).toFixed(0)}" ry="${(k*h*.1).toFixed(0)}" transform="rotate(${rot} ${cx.toFixed(0)} ${cy.toFixed(0)})" fill="none" stroke="var(--contour)" stroke-width="1"/>`;return s}

function profileSVG(r,W=1000,H=120){

function wireScrubber(r,uid,onMove){

  function show(p){state=p;const x=pr.X(p.mi);cur.setAttribute("x1",x);cur.setAttribute("x2",x);
    set("mi",p.mi.toFixed(2));set("el",fmt(Math.round(p.ele*3.28084)));set("cl",fmt(Math.round(p.climb*3.28084)));set("t",mmss(p.t));

async function wireRoute(r){

  const toVid=t=>t/P.tEnd*vidDur(), toTrack=v=>v/vidDur()*P.tEnd;

  map.move(sc.get());

    else{if(simLast)simT+=(ts-simLast)/1000*Math.max(1,P.tEnd/60);simLast=ts;if(simT>=P.tEnd){simT=P.tEnd;setBtn(false)}const p=atTime(P,simT);sc.show(p);map.move(p);if(out)out.href=ytLink(r,simT)}
    if(playing)raf=requestAnimationFrame(loop);
  }
  btn.onclick=()=>{
    if(player&&player.playVideo){playing?player.pauseVideo():player.playVideo();return}
    if(!playing&&simT>=P.tEnd)simT=0;setBtn(!playing);simLast=0;if(playing)raf=requestAnimationFrame(loop)};
  if(LIVE){
    const YT=await loadYT();
    player=new YT.Player("yt",{videoId:r.yt,playerVars:{playsinline:1,rel:0,modestbranding:1},
      events:{onStateChange:e=>{const on=e.data===YT.PlayerState.PLAYING;setBtn(on);cancelAnimationFrame(raf);if(on)raf=requestAnimationFrame(loop)}}});
  }

}

/* Topo background */
function drawTopo(){
  const c=document.getElementById("topo");if(!c)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  c.width=w*dpr;c.height=h*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
  g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--contour").trim()||"#bbb";g.lineWidth=1;
  const hills=[[.1,.2,.22,1],[.4,.9,.25,.9],[.8,.15,.3,1.1],[.97,.85,.2,.7],[.55,.45,.18,.6]];
  const f=(x,y)=>{let v=0;for(const[hx,hy,s,a]of hills){const dx=x/w-hx,dy=(y/h-hy)*h/w*1.6;v+=a*Math.exp(-(dx*dx+dy*dy)/(2*s*s))}return v};
  const cs=8,nx=Math.ceil(w/cs)+1,ny=Math.ceil(h/cs)+1,F=new Float32Array(nx*ny);
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)F[j*nx+i]=f(i*cs,j*cs);
  for(let lv=.08;lv<1.4;lv+=.08){g.beginPath();
    for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
      const a=F[j*nx+i],b=F[j*nx+i+1],cc=F[(j+1)*nx+i+1],d=F[(j+1)*nx+i];
      const k=(a>lv)|((b>lv)<<1)|((cc>lv)<<2)|((d>lv)<<3);if(k===0||k===15)continue;
      const x=i*cs,y=j*cs,l=(p,q)=>(lv-p)/(q-p);
      const T=[x+cs*l(a,b),y],R=[x+cs,y+cs*l(b,cc)],B=[x+cs*l(d,cc),y+cs],Lf=[x,y+cs*l(a,d)];
      const s={1:[Lf,T],2:[T,R],3:[Lf,R],4:[R,B],5:[Lf,T,R,B],6:[T,B],7:[Lf,B],8:[B,Lf],9:[B,T],10:[T,R,B,Lf],11:[B,R],12:[R,Lf],13:[R,T],14:[T,Lf]}[k];
      for(let q=0;q<s.length;q+=2){g.moveTo(...s[q]);g.lineTo(...s[q+1])}}
    g.stroke()}
}

/* ---------- Router ---------- */
const nav=document.getElementById("nav"),menuBtn=document.getElementById("menuBtn");
function setCurrent(tok){document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.link===tok)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
function go(tok,push=true){
  tok=tok||"home";if(cleanup){cleanup();cleanup=null}
  const r=ROUTES.find(x=>x.id===tok);let jump=null;
  if(r){app.innerHTML=viewRoute(r);wireRoute(r);setCurrent("routes");document.title=r.name+" · Prex Map"}
  else if(tok==="routes"||tok==="races"){app.innerHTML=viewRoutes(tok==="races"?"Race courses":"All routes");wireRoutes(tok==="races"?"race":null);setCurrent(tok);document.title=(tok==="races"?"Race courses":"Routes")+" · Prex Map"}
  else if(tok==="about"){app.innerHTML=viewAbout();setCurrent("about");document.title="About · Prex Map"}
  else{app.innerHTML=viewHome();wireHome();setCurrent(tok==="support"?"support":"home");document.title="Prex Map: see the trail before you go";if(tok==="support")jump="support-sec"}
  if(push){try{history.pushState(null,"","#"+tok)}catch(e){}}
  if(jump){const el=document.getElementById(jump);el&&el.scrollIntoView()}else window.scrollTo(0,0);
  nav.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");
}
menuBtn.onclick=()=>{const o=nav.classList.toggle("open");menuBtn.setAttribute("aria-expanded",o)};
document.addEventListener("click",e=>{
  const a=e.target.closest("a[data-link]");if(a){e.preventDefault();go(a.dataset.link);return}
  const b=e.target.closest(".copy");if(b){const txt=b.dataset.copy;
    const sel=()=>{const r=document.createRange();r.selectNodeContents(b.parentElement.querySelector("code"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Copy it from your device menu")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Copied "+txt),sel)}catch(err){sel()}}
});
addEventListener("popstate",()=>go(location.hash.slice(1),false));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawTopo,150)});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",drawTopo)}catch(e){}
new MutationObserver(drawTopo).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
go(location.hash.slice(1),false);
</script>
